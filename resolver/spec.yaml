# Code Chrome has restructured. Exactly one alternative's functions must all resolve uniquely;
# its sections are merged into the ones above and then validated normally, so a table only names
# what its build has.
oneOf:
  # The layout of the unpinned tabs. Up to 157 one class serves both orientations and picks the
  # vertical branch by orientation_; 158 split it into ...VerticalLayout / ...HorizontalLayout.
  # version.dll hooks whichever function the table names (see features/layout.cpp).
  unpinned tab layout:
    - functions:
        UnpinnedTabContainerViewVerticalLayout::CalculateProposedLayout:
          symbol: "?CalculateProposedLayout@UnpinnedTabContainerViewVerticalLayout@@MEBA?AUProposedLayout@views@@AEBVSizeBounds@3@@Z"
    - functions:
        UnpinnedTabContainerViewLayout::CalculateProposedLayout:
          symbol: "?CalculateProposedLayout@UnpinnedTabContainerViewLayout@@UEBA?AUProposedLayout@views@@AEBVSizeBounds@3@@Z"
      fields:
        UnpinnedTabContainerViewLayout.orientation_: [UnpinnedTabContainerViewLayout, orientation_]
      types:
        UnpinnedTabContainerViewLayout: 0x278
  # The drag handler interface and implementation were collapsed into one concrete class in 158.
  tab drag handler:
    - functions:
        TabDragHandler::EndDrag:
          symbol: "?EndDrag@TabDragHandler@@QEAAXW4EndDragReason@@@Z"
    - functions:
        TabDragHandlerImpl::EndDrag:
          symbol: "?EndDrag@TabDragHandlerImpl@@UEAAXW4EndDragReason@@@Z"
