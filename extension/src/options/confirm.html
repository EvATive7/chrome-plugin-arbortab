<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Close subtree?</title>

      :root { color-scheme: light dark; font-family: system-ui, "Segoe UI", sans-serif; }
      body { margin: 16px; line-height: 1.5; }
      button { padding: 6px 14px; border-radius: 6px; cursor: pointer; }
