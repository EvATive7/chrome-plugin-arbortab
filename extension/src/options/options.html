<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ArborTab options</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      body {
        margin: 24px auto;
        max-width: 640px;
        padding: 0 16px;
        line-height: 1.5;
      }
      h1 {
        font-size: 1.35rem;
        margin-bottom: 4px;
      }
      p.hint {
        margin-top: 0;
        opacity: 0.75;
        font-size: 0.9rem;
      }
      fieldset {
        border: 1px solid color-mix(in srgb, currentColor 25%, transparent);
        border-radius: 8px;
        margin: 16px 0;
        padding: 12px 16px;
      }
      label {
        display: block;
        margin: 10px 0;
      }
      input[type="number"] {
        width: 90px;
      }
      .status {
        display: inline-block;
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 0.85rem;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .ok {
        color: #15803d;
      }
      .bad {
        color: #b91c1c;
      }
      button {
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid color-mix(in srgb, currentColor 30%, transparent);
        background: transparent;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>ArborTab</h1>
    <p class="hint">Tree management for Chrome's native vertical tab strip.</p>

    <fieldset>
      <legend>Native module</legend>
      <p>
        Status: <span id="native-status" class="status">checking…</span>
      </p>
      <p id="native-detail" class="hint"></p>
    </fieldset>

    <fieldset>
      <legend>Display</legend>
      <label>Indent per level (px) <input id="indent" type="number" min="4" max="64" step="1" /></label>
      <label><input id="showCount" type="checkbox" /> Show the hidden-child count on collapsed tabs</label>
    </fieldset>

    <fieldset>
      <legend>Behaviour</legend>
      <label>
        Close confirmation when closing this many descendants (0 = never ask)
        <input id="confirmThreshold" type="number" min="0" max="99" step="1" />
      </label>
      <label><input id="newTabButtonIsChild" type="checkbox" /> The + button opens a child of the current tab</label>
    </fieldset>

    <button id="save">Save</button>
    <span id="saved" class="hint"></span>

    <script type="module" src="options.js"></script>
  </body>
</html>
