name: Resolve Chrome offsets

on:
  workflow_dispatch:
    inputs:
      revoke:
        description: "Leave empty for a normal run. Only to revoke a published offsets file: its SHA-256 (see AGENTS.md)"
        required: false
        default: ""
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: offsets
  cancel-in-progress: false

jobs:
  # Lists the builds Omaha currently serves that have no offsets under the current schema.
  # Stable is several builds at once (staged rollout), not just the newest; see query-chrome.py.
  plan:
    runs-on: ubuntu-latest
    outputs:
      builds: ${{ steps.chrome.outputs.builds }}
      count: ${{ steps.chrome.outputs.count }}
      schema: ${{ steps.schema.outputs.schema }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Read schema
        id: schema
        run: |
          # Offsets are published per schema: a schema bump makes every version "unresolved".
          echo "schema=$(sed -nE 's/^schema:\s*([0-9]+).*/\1/p' resolver/spec.yaml)" >> "$GITHUB_OUTPUT"

      - name: Query stable Chrome builds
        id: chrome
        run: |
          if git fetch origin offsets:refs/remotes/origin/offsets 2>/dev/null; then
            git worktree add --detach ../offsets-branch origin/offsets
          else
            echo 'offsets branch does not exist yet; treating every build as unresolved'
            mkdir -p ../offsets-branch
          fi
          uv run python tools/ci/query-chrome.py --published ../offsets-branch --schema '${{ steps.schema.outputs.schema }}' --github-output "$GITHUB_OUTPUT"

  resolve:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: windows-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      # One at a time: every build publishes onto the tip of the same offsets branch.
      max-parallel: 1
      matrix:
        build: ${{ fromJSON(needs.plan.outputs.builds) }}
    name: resolve ${{ matrix.build.version }}
    steps:
      # Windows runners default to core.autocrlf=true: a checked-out offsets file would then
      # differ from the bytes git stores and GitHub serves, and its signature would not match.
      # Must run before the checkout: flipping it afterwards makes every file of the CRLF
      # working tree look modified, and the publish step's `git switch` then refuses to run.
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Download and extract Chrome
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path D:\arbortab | Out-Null
          curl.exe -L --fail --retry 5 --output D:\arbortab\chrome-installer.exe '${{ matrix.build.url }}'
          $actual = (Get-FileHash D:\arbortab\chrome-installer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne '${{ matrix.build.sha256 }}') { throw "Installer hash mismatch: $actual" }
          ./tools/ci/extract-chrome.ps1 -Installer D:\arbortab\chrome-installer.exe -Output D:\arbortab\extracted -Version '${{ matrix.build.version }}'

      - name: Read PDB key
        id: pdb
        shell: pwsh
        run: |
          $line = uv run --with pefile python -I tools/re/pdbinfo.py D:\arbortab\extracted\chrome.dll
          if ($LASTEXITCODE -ne 0) { throw 'reading the PDB key failed' }
          $key = ($line -split ' ')[-1].Trim()
          # 32 GUID hex digits + the Age in hex. Only catches gross breakage: a key with the Age
          # appended twice still matches, which is why a long-missing PDB is reported below.
          if ($key -cnotmatch '^[0-9A-F]{32}[0-9A-F]{1,8}$') { throw "Malformed PDB key: '$key'" }
          "key=$key" >> $env:GITHUB_OUTPUT
          Write-Host "PDB key: $key"

      - name: Download PDB
        id: pdbfile
        shell: pwsh
        run: |
          $url = 'https://chromium-browser-symsrv.commondatastorage.googleapis.com/chrome.dll.pdb/${{ steps.pdb.outputs.key }}/chrome.dll.pdb'
          curl.exe -L --fail --retry 5 --compressed --output D:\arbortab\chrome.dll.pdb $url
          if ($LASTEXITCODE -ne 0) {
            # Google publishes symbols hours (sometimes days) after a release; the scheduled
            # runs retry, so a missing PDB is a warning rather than a failure.
            Write-Host "::warning::chrome.dll.pdb for ${{ steps.pdb.outputs.key }} is not on the symbol server yet"
            "available=false" >> $env:GITHUB_OUTPUT
            # Missing for much longer than usual: more likely a wrong key than a slow upload
            # (0.3.x waited days on a key with the Age appended twice). The installer's
            # Last-Modified stands in for the release time.
            $headers = curl.exe -sIL '${{ matrix.build.url }}'
            $modified = $headers | Select-String -Pattern '^last-modified:\s*(.+)$' | Select-Object -Last 1
            if ($modified) {
              $released = [DateTimeOffset]::Parse($modified.Matches[0].Groups[1].Value.Trim())
              $hours = [int]([DateTimeOffset]::UtcNow - $released).TotalHours
              Write-Host "Installer published $hours hours ago"
              if ($hours -ge 48) { "stale=$hours" >> $env:GITHUB_OUTPUT }
            }
            $global:LASTEXITCODE = 0
          } else {
            "available=true" >> $env:GITHUB_OUTPUT
          }

      - name: Resolve and validate offsets
        if: steps.pdbfile.outputs.available == 'true'
        shell: pwsh
        run: |
          uv run --with pefile --with pyyaml python resolver/resolve.py --dll D:\arbortab\extracted\chrome.dll --pdb D:\arbortab\chrome.dll.pdb --out "D:\arbortab\${{ steps.pdb.outputs.key }}.json"
          if ($LASTEXITCODE -ne 0) { throw 'resolving the offsets failed' }
          # The file name, the PDB we downloaded and the key version.dll will compare against
          # must all be the same key.
          $resolved = (Get-Content -Raw "D:\arbortab\${{ steps.pdb.outputs.key }}.json" | ConvertFrom-Json).pdbKey
          if ($resolved -cne '${{ steps.pdb.outputs.key }}') { throw "PDB key mismatch: pdbinfo.py says ${{ steps.pdb.outputs.key }}, resolve.py says $resolved" }

      # Informational: what the new table changes relative to the newest older one of the same
      # schema, in the log and on the run's summary page. Never fails the run.
      - name: Compare with the previous offsets
        if: steps.pdbfile.outputs.available == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $schema = '${{ needs.plan.outputs.schema }}'
          $new = "D:\arbortab\${{ steps.pdb.outputs.key }}.json"
          git fetch origin offsets:refs/remotes/origin/offsets 2>$null
          if ($LASTEXITCODE -ne 0) { "No published offsets to compare with." >> $env:GITHUB_STEP_SUMMARY; exit 0 }
          git worktree add --detach D:\offsets-previous origin/offsets 2>$null
          $previous = uv run python -I tools/ci/offsets_index.py previous D:\offsets-previous $schema '${{ matrix.build.version }}'
          if ($LASTEXITCODE -eq 0 -and $previous) {
            uv run python -I tools/ci/offsets_diff.py $previous $new --summary $env:GITHUB_STEP_SUMMARY
          } else {
            "No earlier Chrome version under schema $schema to compare with." >> $env:GITHUB_STEP_SUMMARY
          }
          git worktree remove --force D:\offsets-previous
          $global:LASTEXITCODE = 0

      - name: Publish offsets branch
        if: steps.pdbfile.outputs.available == 'true'
        shell: pwsh
        run: |
          $version = '${{ matrix.build.version }}'
          $key = '${{ steps.pdb.outputs.key }}'
          $schema = '${{ needs.plan.outputs.schema }}'
          # The script lives on main, which is about to be switched away.
          Copy-Item tools/ci/offsets_index.py D:\arbortab\offsets_index.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin offsets:refs/remotes/origin/offsets 2>$null
          if ($LASTEXITCODE -eq 0) {
            git switch --force-create offsets origin/offsets
            if ($LASTEXITCODE -ne 0) { throw 'switching to the offsets branch failed' }
          } else {
            git switch --orphan offsets
            if ($LASTEXITCODE -ne 0) { throw 'creating the offsets branch failed' }
            git rm -rf . --quiet
          }
          uv run python -I D:\arbortab\offsets_index.py add . $schema $version $key "D:\arbortab\$key.json"
          if ($LASTEXITCODE -ne 0) { throw 'publishing the offsets failed' }
          git add -A index.json win64 .gitattributes
          git commit -m "offsets: Chrome $version (schema $schema)"
          if ($LASTEXITCODE -ne 0) { throw 'committing the offsets failed' }
          git push origin offsets
          if ($LASTEXITCODE -ne 0) { throw 'pushing the offsets branch failed' }

      - name: Report long-missing PDB
        if: steps.pdbfile.outputs.stale != ''
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $title = "PDB missing for Chrome ${{ matrix.build.version }}"
          $existing = gh issue list --state open --search "in:title $title" --json number --jq '.[0].number'
          if ($existing) { Write-Host "already reported in #$existing"; exit 0 }
          $key = '${{ steps.pdb.outputs.key }}'
          $body = "chrome.dll.pdb for key ``$key`` is still not on the symbol server ${{ steps.pdbfile.outputs.stale }} hours after the installer was published.`n`n" +
            "First check the key itself (``uv run --with pefile python -I tools/re/pdbinfo.py <chrome.dll>`` must equal what version.dll logs), then the URL:`n" +
            "https://chromium-browser-symsrv.commondatastorage.googleapis.com/chrome.dll.pdb/$key/chrome.dll.pdb`n`n" +
            "Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          gh issue create --title $title --body $body

      - name: Create issue on failure
        if: failure() && steps.pdbfile.outputs.available != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $title = "Offsets failed for Chrome ${{ matrix.build.version }}"
          $body = "Workflow: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID`n`nResolver or validation failed; inspect the workflow log for the missing symbol/type/check."
          $existing = gh issue list --state open --search "in:title $title" --json number --jq '.[0].number'
          if ($existing) { gh issue comment $existing --body $body } else { gh issue create --title $title --body $body }

  sign:
    needs: [plan, resolve]
    # Also when nothing was resolved, or one build failed: signing and revoking are independent.
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: windows-latest
    steps:
      - name: Keep line endings as stored
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Every run: signs what is not signed yet (new tables, and any published before signing
      # existed) and applies a requested revocation. version.dll refuses unsigned files.
      - name: Sign the offsets branch
        env:
          OFFSETS_SIGNING_KEY: ${{ secrets.OFFSETS_SIGNING_KEY }}
          REVOKE: ${{ inputs.revoke }}
        shell: pwsh
        run: |
          if (-not $env:OFFSETS_SIGNING_KEY) { throw 'The OFFSETS_SIGNING_KEY secret is not set; see AGENTS.md.' }
          git fetch origin offsets:refs/remotes/origin/offsets 2>$null
          if ($LASTEXITCODE -ne 0) { Write-Host 'nothing published yet'; $global:LASTEXITCODE = 0; exit 0 }
          git worktree add -B offsets D:\offsets-sign origin/offsets
          # Files are only signed in the current layout (win64/s<schema>/).
          uv run python -I tools/ci/offsets_index.py migrate D:\offsets-sign
          if ($LASTEXITCODE -ne 0) { throw 'migrating the offsets layout failed' }
          if ($env:REVOKE) {
            uv run --with cryptography python -I tools/ci/offsets_sign.py revoke D:\offsets-sign $env:REVOKE
            if ($LASTEXITCODE -ne 0) { throw 'revoking failed' }
          }
          uv run --with cryptography python -I tools/ci/offsets_sign.py sign D:\offsets-sign
          if ($LASTEXITCODE -ne 0) { throw 'signing failed' }
          uv run --with cryptography python -I tools/ci/offsets_sign.py verify D:\offsets-sign
          if ($LASTEXITCODE -ne 0) { throw 'signature check failed' }
          Push-Location D:\offsets-sign
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $message = if ($env:REVOKE) { "offsets: revoke $env:REVOKE" } else { 'offsets: migrate and sign' }
            git commit -m $message
            git push origin offsets
          }
          Pop-Location
          $global:LASTEXITCODE = 0
