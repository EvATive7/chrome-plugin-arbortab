name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v5

      - name: Unit tests (extension)
        run: node --test extension/test/*.test.mjs

      - name: Version, locales and offsets consistency
        run: uv run python -I tools/ci/check_repo.py

      - name: Python tools compile
        run: uv run python -I -m compileall -q tools resolver

  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build version.dll (Release)
        shell: pwsh
        run: ./tools/dev/build-native.ps1 -Configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: version.dll
          path: artifacts/native/version.dll
